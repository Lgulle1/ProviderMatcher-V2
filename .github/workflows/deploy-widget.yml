name: Deploy Widget to GitHub Pages

on:
  # Merging to main is the release. main is protected by a ruleset requiring a
  # pull request and green verify + database checks, so nothing reaches this
  # workflow unreviewed -- that is the approval gate. Duplicating it as a manual
  # dispatch only meant the widget silently stopped shipping for nine days while
  # a merged WCAG contrast fix sat undeployed.
  push:
    branches: [main]
  # Kept so the current main can be redeployed without an empty commit.
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: widget-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Build widget
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          cd widget
          npm ci
          NODE_ENV=production node build.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./widget/dist
