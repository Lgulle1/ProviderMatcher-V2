name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0 -- 20 is
          # no longer in its supported range.
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b --force

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build widget
        working-directory: widget
        run: |
          npm install
          NODE_ENV=production node build.js

      # Blocking: the error count is zero, so any new one is a regression.
      # Warnings (react-hooks/exhaustive-deps in Analytics and DataTable) are
      # still reported but do not fail the build.
      - name: Lint
        run: npm run lint
