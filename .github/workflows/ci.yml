name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Keep in step with the other workflows and .nvmrc -- the widget must
          # be built and tested on the same runtime it is deployed on. jsdom 30
          # also requires Node ^22.22.2 || ^24.15.0 || >=26.0.0.
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install locked widget dependencies
        working-directory: widget
        run: npm ci

      - name: Complete release verification
        run: npm run verify

      - name: Generate CycloneDX software bills of materials
        run: |
          npm sbom --sbom-format cyclonedx > sbom-application.cdx.json
          npm --prefix widget sbom --sbom-format cyclonedx > sbom-widget.cdx.json

      - name: Upload software bills of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-bills-of-materials
          path: |
            sbom-application.cdx.json
            sbom-widget.cdx.json
          if-no-files-found: error
          retention-days: 30

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.0

      - name: Rebuild and verify disposable database
        run: npm run verify:db -- --allow-reset
