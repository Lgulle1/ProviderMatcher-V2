name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: supabase-${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      WIDGET_SESSION_SECRET: ${{ secrets.WIDGET_SESSION_SECRET }}
      ADMIN_ALLOWED_ORIGINS: ${{ vars.ADMIN_ALLOWED_ORIGINS }}
      ADMIN_INVITE_REDIRECT_URL: ${{ vars.ADMIN_INVITE_REDIRECT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.0

      - name: Validate required deployment configuration
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
          test "${#WIDGET_SESSION_SECRET}" -ge 32
          [[ "$ADMIN_INVITE_REDIRECT_URL" == https://* ]]
          test -n "$ADMIN_ALLOWED_ORIGINS"

      - name: Link approved project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Configure Edge Function secrets
        shell: bash
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            WIDGET_SESSION_SECRET="$WIDGET_SESSION_SECRET" \
            ADMIN_ALLOWED_ORIGINS="$ADMIN_ALLOWED_ORIGINS" \
            ADMIN_INVITE_REDIRECT_URL="$ADMIN_INVITE_REDIRECT_URL"

      - name: Apply reviewed migrations
        run: supabase db push --linked --include-all --yes

      - name: Deploy public widget data
        run: supabase functions deploy widget-data --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy signed tracking
        run: supabase functions deploy track-session --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy owner-only invitations
        run: supabase functions deploy invite-member --project-ref "$SUPABASE_PROJECT_ID"

      - name: Run database advisors
        run: supabase db advisors --linked --level error
