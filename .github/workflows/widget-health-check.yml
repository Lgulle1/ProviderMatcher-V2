name: Widget Health Check

# Catches drift between the widget.js on the approved company asset host and the
# deployed track-session/widget-data edge functions (Supabase) -- the two
# ship independently, so nothing else guarantees they still agree.
#
# Runs every morning, and also right after anything merges to main so a
# breaking deploy is caught within minutes instead of the next morning.
on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC daily (~7-8am US Eastern)
  push:
    branches: [main]
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Only run if widget health check is configured. Skip silently if variable
    # is missing (common before staging/production setup). GitHub Actions 'if:'
    # cannot reference secrets directly; the secret will still be empty if not
    # configured, causing the script to fail gracefully with a clear error.
    if: vars.WIDGET_HEALTH_SUPABASE_URL != ''
    env:
      WIDGET_HEALTH_SUPABASE_URL: ${{ vars.WIDGET_HEALTH_SUPABASE_URL }}
      WIDGET_HEALTH_ANON_KEY: ${{ secrets.WIDGET_HEALTH_ANON_KEY }}
      WIDGET_HEALTH_WIDGET_ID: ${{ vars.WIDGET_HEALTH_WIDGET_ID }}
      WIDGET_HEALTH_ORIGIN: ${{ vars.WIDGET_HEALTH_ORIGIN }}
      WIDGET_HEALTH_SCRIPT_URL: ${{ vars.WIDGET_HEALTH_SCRIPT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Run widget/edge-function contract checks
        run: node scripts/widget-health-check.mjs
