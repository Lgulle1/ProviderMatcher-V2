project_id = "provider-matcher-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.rate_limit]
sign_in_sign_ups = 10
token_refresh = 60
token_verifications = 20
email_sent = 5

[auth.email]
# Despite the name, the CLI maps this to GOTRUE_EXTERNAL_EMAIL_ENABLED, so
# setting it false turns the email provider off entirely -- signup AND signin.
# It made every password login fail with "Email logins are disabled", which
# blocked the integration tests from authenticating as a tenant at all.
#
# Public signup is blocked by [auth].enable_signup above (GOTRUE_DISABLE_SIGNUP),
# and invite-only onboarding is enforced in the database by complete_signup,
# which requires auth.users.invited_at. Neither depends on this flag, so
# enabling the provider does not reopen self-serve signup.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false
